<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--headding tag-->
    <h1>Student Registration Form</h1>
    <br>
    
    <form action="">
        <label for="">Full Name:</label>
        <input type="text" placeholder="Enter name" required>
        <br>
        <br>
        
        <label for="">Email:</label>
        <input type="email" placeholder="Enter your email">
        <br>
        <br>

        <label for="">Password:</label>
        <input type="password" >
        <br>
        <br>

        <p>Gender:</p>
        
        <label for="male"><input type ="radio" name ="Gender" id ="male" required >Male</label>
        <label for="Female"><input type ="radio" name ="Gender" id ="Female" required >Female</label>
        <br>
        <br>

        <label for="">Skills:</label>
        <br>
        <label for="HTML"><input type ="button" name ="Skills" id ="HTML" required >HTML</label>
        
        <label for="CSS"><input type ="button" name ="Skills" id ="CSS" required >CSS</label>
        <label for="Java Script"><input type ="button" name ="Skills" id ="Java Script" required >Java Script</label>
        <br>
        <br>
        <label for="">Date of Birth:</label>
        <input type="date" required>
        <br>
        <br>
        <button type="subit">Register</button>
        <br>
        <br>
        <br>
        <br>
        <h1>Submitted Students</h1>
        <table border="1">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Gender</th>
                <th>Skills</th>
                <th>DOB</th>
            </tr>

            <tr>
                <td>Alice</td>

            </tr>

            <tr>
                <td>Bob</td>

                <td>JavaScript</td>
                <td>2001-11-22</td>
            </tr>
        
        </table>






        
    </form>
    
</body>
</html>
